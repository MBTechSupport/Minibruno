<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direcciones | Mini Bruno Sucesores C.A.</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/index-extras.css">
    <link rel="stylesheet" href="../css/index-premium.css">
    <link rel="stylesheet" href="../css/index.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(33, 51, 121, 0.15);
            z-index: 1000;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo-image {
            height: 45px;
            width: auto;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        .article-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .article-title {
            font-size: 3.5rem;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1rem;
        }

        .location-grid {
            display: grid;
            gap: 3rem;
            margin-top: 3rem;
        }

        .location-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(33, 51, 121, 0.2);
            transition: all 0.4s ease;
        }

        .location-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(33, 51, 121, 0.3);
        }

        .location-item h3 {
            font-size: 2rem;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1.5rem;
            color: var(--primary-dark);
        }

        .location-item p {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--text-light);
            text-align: justify;
            margin-bottom: 1.5rem;
        }

        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(33, 51, 121, 0.2);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .article-title {
                font-size: 2.5rem;
            }

            .map-container {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <a href="../index.html" class="home-button-wrapper neon-glow">
                <img src="../img_ref/bd_brunito/logo_glow.svg" alt="Logo" class="logo-image">
                <span class="home-button-text font-tech">Volver al Inicio</span>
                <i class="fas fa-arrow-left home-arrow-icon"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="article-header">
            <h1 class="article-title gradient-text">Direcciones de Nuestras Plantas</h1>
        </div>

        <div class="location-grid">
            <div class="location-item tech-card">
                <h3 class="font-tech">Planta Río Cristal - Caracas</h3>
                <p>Carretera Vieja Los Teques Km 7, Sector Río Cristal-Macarao, Planta Mini Bruno Sucesores
                    Caracas-Venezuela</p>
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3929.57457484774!2d-66.9174716852045!3d10.4195549925439!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDI1JzEwLjQiTiA2NsKwNTUnMDAuOSJX!5e0!3m2!1ses!2sve!4v1600000000000!5m2!1ses!2sve"
                        allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <div class="location-item tech-card">
                <h3 class="font-tech">Planta Santa Cruz</h3>
                <p>Final 2da. Av. Parcela G-25 y G-26. Zona Industrial de Santa Cruz. Edo. Aragua, Venezuela</p>
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3924.123456789012!2d-67.41234567890123!3d10.123456789012345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDA3JzI0LjQiTiA2N8KwMjQnNDUuMCJX!5e0!3m2!1ses!2sve!4v1600000000000!5m2!1ses!2sve"
                        allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
