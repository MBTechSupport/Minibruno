<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teléfonos de Contacto | Mini Bruno Sucesores C.A.</title>

    <link rel="stylesheet" href="../css/index-extras.css">
    <link rel="stylesheet" href="../css/index-premium.css">
    <link rel="stylesheet" href="../css/index.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(33, 51, 121, 0.15);
            z-index: 1000;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo-image {
            height: 45px;
            width: auto;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        .article-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .article-title {
            font-size: 3.5rem;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1rem;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 3rem;
            margin-top: 3rem;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid rgba(33, 51, 121, 0.2);
            transition: all 0.4s ease;
            text-align: center;
        }

        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(33, 51, 121, 0.3);
        }

        .contact-item h3 {
            font-size: 2rem;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 2rem;
            color: var(--primary-dark);
        }

        .phone-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            color: var(--text-light);
        }

        .phone-item i {
            font-size: 1.5rem;
            color: var(--primary-light);
        }

        @media (max-width: 768px) {
            .article-title {
                font-size: 2.5rem;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <a href="../index.html" class="home-button-wrapper neon-glow">
                <img src="../img_ref/bd_brunito/logo_glow.svg" alt="Logo" class="logo-image">
                <span class="home-button-text font-tech">Volver al Inicio</span>
                <i class="fas fa-arrow-left home-arrow-icon"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="article-header">
            <h1 class="article-title gradient-text">Teléfonos de Contacto</h1>
        </div>

        <div class="contact-grid">
            <div class="contact-item tech-card">
                <h3 class="font-tech">Planta Río Cristal</h3>
                <div class="phone-item">
                    <i class="fas fa-phone"></i>
                    <span>+58-212-434-5074</span>
                </div>
                <div class="phone-item">
                    <i class="fas fa-phone"></i>
                    <span>+58-212-434-4946</span>
                </div>
                <div class="phone-item">
                    <i class="fas fa-mobile-alt"></i>
                    <span>+58-412-265-2445</span>
                </div>
            </div>

            <div class="contact-item tech-card">
                <h3 class="font-tech">Planta Santa Cruz</h3>
                <div class="phone-item">
                    <i class="fas fa-phone"></i>
                    <span>+58-243-200-2300</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
