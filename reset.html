<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

</head>

<body class="matrix-bg cyber-grid">
    <div class="login-card floating-animation">
        <!-- Logo Header (Added for consistency) -->
        <div class="text-center mb-6" data-aos="fade-down">
            <div class="flex items-center justify-center space-x-3 mb-4">
                <div
                    class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center neon-glow pulse-animation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="text-white">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray font-tech">MiniBruno TechSupport</h1>
            </div>
            <div class="rgb-divider rounded-full mx-auto w-32"></div>
        </div>

        <div class="card-icon">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
            </svg>
        </div>

        <h1 class="font-tech hologram-text">Restablecer Contraseña</h1>
        <p class="subtitle">
            Ingresa tu dirección de correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" class="input-field" placeholder="tu@email.com" required>
            </div>

            <button type="submit" class="neon-button font-tech pulse-animation">
                Enviar Enlace
            </button>
        </form>

        <div id="errorMessage" class="error-message">
            <!-- Mensaje de error -->
        </div>

        <div id="successMessage" class="success-message">
            <!-- Mensaje de éxito -->
        </div>

        <a href="login.html" class="home-button-wrapper">
            <div class="neon-glow">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="#428ce2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </div>
            <span class="home-arrow-icon">←</span>
            <span class="home-button-text">Volver al Login</span>
        </a>

        <!-- Footer Info (Added for consistency) -->
        <div class="text-center mt-8 pt-6 border-t border-gray-700/30">
            <div class="flex justify-center space-x-6 text-gray-500 text-sm">
                <a href="terms.html" class="hover:text-gray-300 transition-colors">Términos</a>
                <a href="privacidad.html" class="hover:text-gray-300 transition-colors">Privacidad</a>
                <a href="ayuda.html" class="hover:text-gray-300 transition-colors">Ayuda</a>
            </div>
            <p class="text-gray-600 text-xs mt-4">© 2025 MiniBruno TechSupport. Todos los derechos reservados.</p>
        </div>
    </div>
    <!-- Inicializar AOS Animaciones -->
    <script>
        AOS.init();
    </script>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/reset.js"></script>
</body>

</html>
