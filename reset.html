<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | MiniBruno TechSupport</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="cyber-grid">
    <!-- Botón Premium de Retorno al Inicio (estilo trigger horizontal) -->
    <a href="index.html" class="premium-3d-home-button">
        <div class="button-3d-container">
            <div class="button-3d-inner">
                <div class="particle-effect"></div>
                <div class="glow-layer"></div>
                <div class="trigger-icon">
                    <i class="fas fa-home"></i>
                </div>
                <span class="button-3d-text">¿Quieres volver al Inicio? Clickea acá</span>
                <div class="shine-effect"></div>
            </div>
        </div>
    </a>

    <!-- Sección de Autenticación Unificada -->
    <div id="auth-section">
        <!-- Reset Card -->
        <div class="login-card floating-animation rounded-2xl p-8 scan-line" data-aos="fade-up" data-aos-delay="200">
            <!-- Logo Header -->
            <div class="text-center mb-8" data-aos="fade-down">
                <div class="flex items-center justify-center space-x-3 mb-4">
                    <div
                        class="w-12 h-12 bg-gradient-to-br from-amber-500 to-orange-600 rounded-lg flex items-center justify-center neon-glow pulse-animation">
                        <img src="img_ref/bd_brunito/logo_glow.svg" alt="Logo MiniBruno" class="w-8 h-8 object-contain" />
                    </div>
                    <h1 class="text-2xl font-bold text-gray font-tech">MiniBruno TechSupport</h1>
                </div>
                <div class="rgb-divider rounded-full mx-auto w-32"></div>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white mb-2 font-tech gradient-text">Restablecer Contraseña</h2>
                <p class="text-gray-400">Ingresa tu correo para recibir las instrucciones de recuperación</p>
            </div>

            <!-- Mensajes de error y éxito -->
            <div id="errorMessage" class="message error-message hidden mb-4"></div>
            <div id="successMessage" class="message success-message hidden mb-4"></div>

            <form id="resetForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-gray-300 mb-2 font-tech text-sm">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="mail" class="h-5 w-5 text-gray-400"></i>
                        </div>
                        <input type="email" name="email" id="email" placeholder="tu@empresa.com" required
                            class="input-field w-full pl-10 pr-4 py-3 rounded-lg focus:ring-2 focus:ring-orange-500 transition-all">
                    </div>
                </div>

                <button type="submit"
                    class="neon-button text-white py-3 px-6 rounded-lg font-medium font-tech w-full transition-all">
                    <i data-feather="send" class="inline mr-2"></i> Enviar Enlace de Recuperación
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-gray-400 mb-4">¿Recordaste tu contraseña?</p>
                <a href="login.html" class="home-button-wrapper">
                    <div class="neon-glow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    </div>
                    <span class="home-arrow-icon">←</span>
                    <span class="home-button-text">Volver al Login</span>
                </a>
            </div>

            <!-- Footer Info -->
            <div class="text-center mt-8 pt-6 border-t border-gray-700/30">
                <div class="flex justify-center space-x-6 text-gray-500 text-sm">
                    <a href="terminos.html" class="hover:text-gray-300 transition-colors">Términos</a>
                    <a href="privacidad.html" class="hover:text-gray-300 transition-colors">Privacidad</a>
                    <a href="ayuda.html" class="hover:text-gray-300 transition-colors">Ayuda</a>
                </div>
                <p class="text-gray-600 text-xs mt-4">© 2025 MiniBruno TechSupport. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <!-- Inicializar AOS Animaciones -->
    <script>
        AOS.init();
    </script>

    <!-- Inicializar Feather Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.feather) {
                window.feather.replace();
            }
        });
    </script>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/reset.js"></script>
</body>

</html>
